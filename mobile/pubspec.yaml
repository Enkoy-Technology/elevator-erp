name: site_survey
description: "Shining Star Sales: site surveys for the sales team."
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/fonts/OFL-Archivo.txt
    - assets/fonts/OFL-IBMPlexMono.txt
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-400.ttf
        - asset: assets/fonts/Archivo-500.ttf
          weight: 500
        - asset: assets/fonts/Archivo-600.ttf
          weight: 600
        - asset: assets/fonts/Archivo-700.ttf
          weight: 700
        - asset: assets/fonts/Archivo-800.ttf
          weight: 800
    # Measurements: figures that line up and read as numbers, not prose.
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500

# `dart run flutter_launcher_icons` regenerates the app icons from these.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon-foreground.png
  remove_alpha_ios: true
